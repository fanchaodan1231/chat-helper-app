<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>聊天助手</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#0f1115;color:#e6e6e6;
  display:flex;flex-direction:column;font-size:16px;max-width:560px;margin:0 auto;min-height:100dvh;
  border-left:1px solid #1c1f25;border-right:1px solid #1c1f25}
header{flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#181a1f;
  border-bottom:1px solid #262b33;position:sticky;top:0;z-index:5}
header select{flex:1;background:#22252b;color:#e6e6e6;border:1px solid #33363d;border-radius:10px;padding:10px;font-size:15px}
header button{background:#22252b;border:0;color:#c8ccd2;border-radius:10px;padding:10px 12px;font-size:16px}
#updBanner{display:none;background:#1f6feb;color:#fff;text-align:center;padding:10px;font-size:14px;font-weight:bold;cursor:pointer}
#app{display:flex;flex:1;min-height:0}
#side{display:none;flex:0 0 230px;background:#14161b;border-right:1px solid #262b33;flex-direction:column}
#side.open{display:flex}
.sidehead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-size:13px;color:#8a9099;border-bottom:1px solid #22262d}
.sidehead button{background:#2a2d33;border:0;color:#c8ccd2;border-radius:8px;padding:4px 10px;font-size:15px}
#clist{flex:1;overflow-y:auto}
.citem{padding:12px 14px;border-bottom:1px solid #1c2027;cursor:pointer}
.citem.on{background:#1f3a22;border-left:3px solid #2e7d32}
.citem .cn{font-size:15px;color:#e6e6e6}
.citem .cs{font-size:11px;color:#7d838a;margin-top:3px}
.sidefoot{padding:10px;border-top:1px solid #22262d}
.sidefoot button{width:100%;padding:10px;border:0;border-radius:9px;background:#22252b;color:#c8ccd2;font-size:13px}
#main{display:flex;flex-direction:column;flex:1;min-width:0}
#title{flex:1;font-size:15px;color:#e6e6e6;text-align:center;font-weight:bold}
#menuBtn{display:block}
#batch{position:fixed;inset:0;background:#0f1115;z-index:10;display:none;overflow-y:auto;padding:14px}
#batch.on{display:block}
#batch textarea{width:100%;background:#22252b;color:#e6e6e6;border:1px solid #33363d;border-radius:10px;padding:10px;font-size:14px;font-family:inherit;line-height:1.6}
#batch .ok{margin-top:12px;width:100%;padding:14px;border:0;border-radius:12px;background:#2e7d32;color:#fff;font-size:16px;font-weight:bold}
#batch .back{margin-top:8px;width:100%;padding:12px;border:0;border-radius:12px;background:#2a2d33;color:#c8ccd2;font-size:15px}
#batch code{background:#22252b;padding:1px 5px;border-radius:4px;color:#9ad19d}
#log{flex:1;overflow-y:auto;padding:12px 14px;min-height:60px}
.m{display:flex;margin:6px 0}
.m.me{justify-content:flex-end}
.b{max-width:80%;padding:9px 12px;border-radius:14px;line-height:1.55;font-size:15px;white-space:pre-wrap;word-break:break-word;cursor:pointer}
.m.her .b{background:#24272e;border-bottom-left-radius:4px}
.m.me .b{background:#2e7d32;border-bottom-right-radius:4px}
.nt{font-size:12px;color:#b8a04a;margin-top:4px;line-height:1.5;max-width:80%;white-space:pre-wrap;word-break:break-word}
.hint{color:#5d626a;font-size:13px;text-align:center;margin:18px 0;line-height:1.8}
#result{flex:0 0 auto;max-height:58vh;overflow-y:auto;border-top:1px solid #262b33;background:#131519;display:none}
#result.on{display:block}
.rd{padding:10px 14px;color:#9fb4c9;font-size:13.5px;border-bottom:1px solid #1f232a}
.rd b{color:#e6e6e6}
.opt{margin:8px 10px;padding:12px 13px;background:#1b1e24;border:1px solid #2a2f37;border-radius:12px}
.opt .tag{font-size:12px;color:#7ee787;font-weight:bold;margin-bottom:6px}
.opt .tx{font-size:16px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.opt .meta{font-size:12px;color:#8a9099;margin-top:8px;line-height:1.6}
.opt .cp{margin-top:10px;width:100%;padding:10px;border:0;border-radius:9px;background:#2e7d32;color:#fff;font-size:15px}
.other{padding:0 14px 14px;font-size:13px;color:#9aa0a6;line-height:1.75}
.other h4{margin:12px 0 4px;font-size:13px;color:#c8ccd2}
footer{flex:0 0 auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom));background:#181a1f;border-top:1px solid #262b33}
footer textarea{width:100%;height:56px;background:#22252b;color:#e6e6e6;border:1px solid #33363d;border-radius:12px;padding:10px 12px;font-size:15px;resize:none;font-family:inherit}
footer .btns{display:flex;gap:8px;margin-top:8px;align-items:stretch}
footer .btns button{flex:1;padding:12px 0;border:0;border-radius:12px;font-size:15px;font-family:inherit}
footer .mini{background:#2a2d33;color:#c8ccd2}
footer .mini.her{color:#8fd3ff}
#go{background:#2e7d32;color:#fff;font-weight:bold;font-size:16px;padding:14px 0}
#go:disabled{background:#2a2d33;color:#6b7078}
#extraBtn{width:100%;margin-top:6px;padding:9px;border:0;border-radius:10px;background:#22252b;color:#8a9099;font-size:13px;font-family:inherit}
#extraBtn.on{background:#2f3742;color:#c8ccd2}
#extraWrap textarea{height:132px;margin-top:6px;font-size:15px;line-height:1.55}
#stat{padding:0 2px 6px;font-size:13px;color:#7ee787;min-height:16px}
#set{position:fixed;inset:0;background:#0f1115;z-index:9;display:none;overflow-y:auto;padding:14px}
#set.on{display:block}
#set h3{font-size:16px;margin:0 0 12px}
#set .setbar{position:sticky;top:0;z-index:3;background:#0f1115;display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px;margin-top:-4px}
#set .setbar b{font-size:16px}
#set #setX{background:#2e7d32;color:#fff;border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:bold}
#set label{display:block;font-size:12px;color:#8a9099;margin:14px 0 5px}
#set input,#set textarea,#set select{width:100%;background:#22252b;color:#e6e6e6;border:1px solid #33363d;border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
#set textarea{resize:vertical;line-height:1.5}
#set .row{display:flex;gap:10px}#set .row>div{flex:1}
#set .ok{margin-top:18px;width:100%;padding:15px;border:0;border-radius:12px;background:#2e7d32;color:#fff;font-size:16px;font-weight:bold}
#set .back{margin-top:10px;width:100%;padding:13px;border:0;border-radius:12px;background:#2a2d33;color:#c8ccd2;font-size:15px}
#set .stabs{display:flex;gap:8px;margin-bottom:14px}
#set .stab{flex:1;padding:11px;border:1px solid #33363d;background:#1b1e24;color:#9aa0a6;border-radius:10px;font-size:14px}
#set .stab.on{background:#2e7d32;color:#fff;border-color:#2e7d32}
#set input[type=range]{padding:0;margin:8px 0 4px;accent-color:#2e7d32;height:26px}
#set .scale{display:flex;justify-content:space-between;font-size:10px;color:#6b7078;margin-bottom:10px}
#set .anaitem{border:1px solid #2a2f37;border-radius:10px;padding:10px;margin-top:8px;background:#16181d}
#set .aitop{font-size:14px;color:#e6e6e6;line-height:1.5}
#set .aimeta{font-size:11px;color:#7d838a;margin-top:5px}
#set .aibody{display:none;font-size:12.5px;color:#b9bdc2;line-height:1.7;margin-top:8px;white-space:pre-wrap}
#set .aibody.on{display:block}
#set .airow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
#set .airow button{padding:7px 10px;border:0;border-radius:8px;background:#2a2d33;color:#c8ccd2;font-size:12px}
#set .airow select{padding:6px;border-radius:8px;background:#22252b;color:#e6e6e6;border:1px solid #33363d;font-size:12px;width:auto}
#set .aifb{width:100%;margin-top:6px;background:#22252b;color:#e6e6e6;border:1px solid #33363d;border-radius:8px;padding:8px;font-size:12.5px}
#set .sechead{margin:22px 0 8px;font-size:13px;color:#cfe3d0;font-weight:bold;border-left:3px solid #2e7d32;padding-left:8px}
@media (min-width:720px){
  #side{display:flex}
  #menuBtn{display:none}
}
</style>
</head>
<body>

<div id="app">
  <aside id="side">
    <div class="sidehead"><span>对象</span><button id="addBtn">＋</button></div>
    <div id="clist"></div>
    <div class="sidefoot">
      <button id="importChatBtn">📥 批量粘贴导入</button>
      <button id="importImgBtn" style="margin-top:6px">📷 截图导入（Soul/微信）</button>
      <input type="file" id="imgFiles" accept="image/*" multiple style="display:none">
    </div>
  </aside>
  <div id="main">
<header>
  <button id="menuBtn">☰</button>
  <div id="title">聊天助手</div>
  <button id="setBtn">⚙️</button>
</header>
<div id="updBanner" style="display:none">🔄 有新版本，点这里更新</div>

<div id="log"></div>
<div id="result"></div>

<footer>
  <div id="stat"></div>
  <textarea id="msg" placeholder="粘贴或输入一条消息…"></textarea>
  <div class="btns">
    <button id="paste" class="mini">粘贴</button>
    <button id="her" class="mini her">她说了</button>
    <button id="mine" class="mini">我发了</button>
  </div>
  <button id="extraBtn">＋ 补充说明（表情包 / 语音 / 背景）</button>
  <div id="extraWrap" style="display:none">
    <textarea id="extra" placeholder="给下面这条的补充信息，比如：表情包是捂脸笑哭 / 她发了 15 秒语音说加班 / 前一句是问我周末干嘛"></textarea>
  </div>
  <div class="btns" style="margin-top:6px">
    <button id="go">出建议</button>
  </div>
</footer>
  </div>
</div>

<div id="batch">
  <div class="setbar"><b>批量导入对话</b><button id="batchX">✕ 关闭</button></div>
  <div style="font-size:12.5px;color:#9aa0a6;line-height:1.8;margin-bottom:10px">
    <b>支持两种格式：</b><br><br>
    <b>① 微信原始格式</b>（PC 微信拖选复制出来的样子）：<br>
    <code>锦瑟 2026-11-04 16:30</code><br>
    <code>刚睡醒</code><br>
    <code>饭炒蛋 2026-11-04 16:31</code><br>
    <code>陛下在上早朝？</code><br><br>
    <b>② 简化格式</b>（自己整理时用）：<br>
    <code>她：刚睡醒</code><br>
    <code>我：陛下在上早朝？</code><br><br>
    昵称和「我的微信昵称」一致的算"我说的"，其他算"她说的"。
  </div>
  <textarea id="batchText" rows="12" placeholder="她：xxx&#10;我：xxx&#10;她：xxx"></textarea>
  <div id="batchInfo" style="font-size:12px;color:#7ee787;margin-top:8px;min-height:16px"></div>
  <button class="ok" id="batchDo">导入到当前对象</button>
  <button class="back" id="batchCancel">取消</button>
</div>

<div id="set">
  <div class="setbar"><b>设置</b><button id="setX">✕ 返回聊天</button></div>
  <div class="stabs">
    <button class="stab on" id="tabProf">人物档案</button>
    <button class="stab" id="tabData">密钥与数据</button>
  </div>

  <div id="paneData" style="display:none">
    <label>DeepSeek API Key（sk- 开头）</label>
    <input id="s_api" placeholder="sk-..." type="password" autocomplete="off">
    <label>我的微信昵称（导入对话时区分谁说的）</label>
    <input id="s_nick" placeholder="饭炒蛋">
    <button class="ok" id="sSave">保存</button>
    <button class="back" id="sExport">导出档案（备份到本地）</button>
    <button class="back" id="sImport">导入档案（选 JSON 文件）</button>
    <input type="file" id="sFile" accept=".json" style="display:none">
    <button class="back" id="sClear">清空当前对象的对话</button>
    <button class="back" id="sClose">关闭</button>
    <div style="font-size:12px;color:#5d6673;margin-top:14px;line-height:1.8">
      版本 <span id="ver">v27</span> · <a href="javascript:location.reload(true)" style="color:#8fb8ff">强制刷新</a><br>
      数据只存在本机浏览器，不上传。
    </div>
  </div>

  <div id="paneProf">
    <div class="row">
      <div><label>名字</label><input id="s_name"></div>
      <div><label>年龄</label><input id="s_age"></div>
    </div>
    <div class="row">
      <div><label>地区</label><input id="s_area"></div>
      <div><label>平台</label><input id="s_platform"></div>
    </div>

    <label>关系阶段：<b id="stageLabel" style="color:#7ee787">刚认识</b></label>
    <input type="range" id="s_stage" min="0" max="5" step="1" value="0">
    <div class="scale"><span>刚认识</span><span>破冰</span><span>在聊</span><span>有热度</span><span>暧昧</span><span>上垒</span></div>

    <label>我的目标</label>
    <select id="s_goal">
      <option>维持热度</option>
      <option>试探身份（她把我当什么人）</option>
      <option>推进到暧昧</option>
      <option>推进到性话题</option>
      <option>约电话/语音</option>
      <option>约见面</option>
      <option>收尾（今天不聊了）</option>
    </select>

    <label>她的类型 / 性格</label>
    <textarea id="s_type" rows="3" placeholder="例：先要身份感再谈性；话题开放但不主动越界；讨厌复杂"></textarea>

    <label>雷区（绝对不能碰）</label>
    <textarea id="s_taboo" rows="3" placeholder="例：别说教、别追问感情、别承诺见面、别主动要照片视频"></textarea>

    <label>我的定位（在她心里我是什么角色）</label>
    <textarea id="s_myrole" rows="2" placeholder="例：高质量文友 / 情绪出口 / 潜在对象"></textarea>

    <label>互动模式</label>
    <textarea id="s_pattern" rows="2" placeholder="例：历史辩论 + 互损 + 表情包；她发语音我只回文字"></textarea>

    <label>其它背景</label>
    <textarea id="s_notes" rows="2" placeholder="补充信息"></textarea>

    <label>历史进度（每行一条）</label>
    <textarea id="s_hist" rows="4"></textarea>

    <div class="sechead">关键信息（自动提取，可手改）</div>
    <textarea id="s_facts" rows="6" placeholder="点下面「提取关键信息」自动填：身高、体重、年龄、生日、地址、职业、家庭、作息、喜好、忌讳…"></textarea>
    <button class="back" id="sFactsBtn">🔍 从对话提取关键信息</button>
    <button class="back" id="sAnalyzeBtn">🧠 增量深度分析（v4-pro）</button>
    <div id="anaMsg" style="font-size:12px;color:#7ee787;margin-top:6px;min-height:14px"></div>
    <div class="sechead">分析历史（可评分/评论，评论会喂给下次分析）</div>
    <div id="anaHistory"></div>

    <button class="ok" id="sSave2">保存</button>
    <button class="back" id="sClose2">关闭</button>
  </div>
</div>

<script>
const KEY='chat_mobile_v1';
const STAGES=['刚认识','破冰','在聊','有热度','暧昧中','上垒（可上床）'];

const STYLE=`【我的说话风格（务必模仿）】
- 短句连发（"是的""对啊""1""狗屎"）或 200-400 字长分析，两极
- 互损是常态："狗屎""放屁""蠢货""你丫的"，但只到玩笑级
- 爱用框架词：必然/偶然、小病大病、天平两端、程序正义、最优解
- 爱列点 1. 2. 3.
- 会自嘲："我是低等牛""我对自己也抠"
- 爱反问："我问你""你能想象吗"
- 表情包：牛系列、猫
- 关心方式是给方案不给情绪
- 绝对不用"宝贝""想你""我在""心疼"，不撒娇不示弱不道歉`;

const RULES=`【规矩】
1. 不许设计"让她以为是她主动"的套路；正确做法是引用她真说过的话、抛问题让她答、把她的答案往前推一步。
2. 一次只推进一步，跳级=关系崩。
3. 她设边界就立刻停，并给一句体面收场。
4. 不美化，她没兴趣就直说。`;

const ASK=`【输出要求】
只输出一个 JSON 对象，不要任何其他文字，格式：
{
 "read":"一句话判读，20字内",
 "score":{"interest":6,"invest":5,"advance":6},
 "options":[
   {"tag":"A 保守","text":"可直接发送的原话","expect":"她大概怎么回","risk":"风险"},
   {"tag":"B 推进","text":"...","expect":"...","risk":"..."},
   {"tag":"C 退一步","text":"...","expect":"...","risk":"..."}
 ],
 "path":["第1步：话术","第2步：话术","第3步：话术"],
 "taboo":["禁忌1","禁忌2","禁忌3"]
}
"text" 必须是一句可以直接发给她的聊天消息（像真人发微信那样）。
不要写"建议表达关心"这类说明文字，也不要输出"我不能帮你"这类拒绝语；
如果某个选项涉及敏感内容，就用含蓄、有分寸的说法，保持可发送。`;

let db={apiKey:'',contacts:[],activeId:null};
try{const r=localStorage.getItem(KEY);if(r)db=JSON.parse(r);}catch(e){}
const $=i=>document.getElementById(i);
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const esc=s=>String(s||'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const now=()=>{const d=new Date();return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const A=()=>db.contacts.find(c=>c.id===db.activeId);

db.contacts.forEach(function(c){
  if(typeof c.stage==='string'){
    var idx=0;
    for(var i=0;i<STAGES.length;i++){ if(c.stage.indexOf(STAGES[i])===0){ idx=i; break; } }
    if(c.stage.indexOf('冷')>=0) idx=1;
    c.stage=idx;
  }
  if(typeof c.stage!=='number') c.stage=0;
});
save();

if(!db.contacts.length){
  db.contacts=[{id:'c1',name:'对象1',age:'',area:'',platform:'微信',stage:0,goal:'维持热度',
    type:'',taboo:'',myrole:'',pattern:'',notes:'',hist:'',dialog:[]}];
  db.activeId='c1'; save();
}

function renderSel(){
  const box=$('clist'); if(!box) return;
  box.innerHTML='';
  db.contacts.forEach(function(c){
    const d=document.createElement('div');
    d.className='citem'+(c.id===db.activeId?' on':'');
    d.innerHTML='<div class="cn">'+esc(c.name||'未命名')+'</div>'+
                '<div class="cs">'+esc(STAGES[c.stage]||'')+' · 第'+(c.dialog?c.dialog.length:0)+'条</div>';
    d.onclick=function(){
      db.activeId=c.id; save(); renderSel(); renderLog();
      $('result').classList.remove('on');
      $('title').textContent=c.name||'未命名';
      if(window.innerWidth<720) $('side').classList.remove('open');
    };
    box.appendChild(d);
  });
  const cur=A();
  if(cur) $('title').textContent=cur.name||'未命名';
}
function renderLog(){
  const c=A(),log=$('log');log.innerHTML='';
  if(!c)return;
  if(!c.dialog.length){
    log.innerHTML='<div class="hint">还没有对话<br>把消息粘到下面，点「她说了」/「我发了」记录<br>需要建议时点「出建议」</div>';
    return;
  }
  c.dialog.forEach((m)=>{
    const d=document.createElement('div');
    d.className='m '+(m.who==='我'?'me':'her');
    const note=m.note?'<div class="nt">📝 '+esc(m.note)+'</div>':'';

function parseBatch(txt){
  var nick=(db.myNick||'饭炒蛋').trim();
  var out=[], cur=null;
  var lines=txt.split(/\r?\n/);
  for(var li=0; li<lines.length; li++){
    var line=lines[li];
    if(!line.trim()) continue;

    // 格式A：她：xxx / 我：xxx（可带时间戳前缀）
    var mA=line.match(/^\s*(?:\d{4}[-\/]\d{1,2}[-\/]\d{1,2}\s+)?(?:\d{1,2}:\d{2}(?::\d{2})?\s+)?(她|我|对方|他|女方|男方)\s*[:：]\s*(.*)$/);
    if(mA){
      var whoA=(mA[1]==='我'||mA[1]==='男方')?'我':'她';
      cur={who:whoA,text:mA[2].trim(),ts:''};
      if(cur.text) out.push(cur); else cur=null;
      continue;
    }

    // 格式B：微信原始格式 —— 名字 + 时间行（如 "锦瑟 2026-11-04 16:30" 或 "锦瑟 16:30"）
    var mB=line.match(/^\s*(.{1,20}?)\s+(?:\d{4}[-\/]\d{1,2}[-\/]\d{1,2}\s+)?\d{1,2}:\d{2}(?::\d{2})?\s*$/);
    if(mB){
      var name=mB[1].trim();
      // 排除包含冒号的普通句子
      if(name.indexOf('：')<0 && name.indexOf(':')<0 && name.length>0){
        cur={who: (name===nick?'我':'她'), text:'', ts:''};
        out.push(cur);   // 先占位，后面的文本行填进去
        continue;
      }
    }

    // 普通文本行：接到上一条
    if(cur){ cur.text += (cur.text?' ':'') + line.trim(); }
  }
  // 丢掉空文本的占位
  return out.filter(function(m){ return m.text && m.text.trim(); });
}

function fileToJpeg(file, maxW){
  return new Promise(function(resolve,reject){
    var img=new Image();
    var url=URL.createObjectURL(file);
    img.onload=function(){
      var w=img.width, h=img.height;
      var scale = maxW && w>maxW ? (maxW/w) : 1;
      var cw=Math.round(w*scale), ch=Math.round(h*scale);
      var cv=document.createElement('canvas');
      cv.width=cw; cv.height=ch;
      cv.getContext('2d').drawImage(img,0,0,cw,ch);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg',0.82));
    };
    img.onerror=function(){ URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src=url;
  });
}

$('importImgBtn').onclick=function(){
  if(!db.apiKey) return alert('先填 API Key');
  $('imgFiles').click();
};
$('imgFiles').onchange=async function(e){
  var files=Array.prototype.slice.call(e.target.files||[]);
  e.target.value='';
  if(!files.length) return;
  const c=A(); if(!c) return alert('先选一个对象');
  if(!confirm('将用 AI 识别 '+files.length+' 张截图并导入到「'+c.name+'」，继续？')) return;
  var total=0, fail=0;
  for(var i=0;i<files.length;i++){
    stat('识别中 '+(i+1)+'/'+files.length+'…');
    try{
      var url=await fileToJpeg(files[i],1100);
      var msgs=await visionExtract(url);
      // 去重：和末尾 3 条重复的丢掉
      var tail=c.dialog.slice(-3).map(function(m){ return m.who+'|'+m.text; });
      msgs.forEach(function(m){
        if(!m || !m.text) return;
        var k=m.who+'|'+m.text;
        if(tail.indexOf(k)>=0) return;
        c.dialog.push({who:(m.who==='我'?'我':'她'), text:m.text, ts:''});
        tail.push(k);
        total++;
      });
      save();
    }catch(err){ fail++; console.log(err); }
  }
  renderLog(); renderSel();
  stat('✅ 导入 '+total+' 条'+(fail?('，'+fail+' 张失败'):''));
};

renderSel(); renderLog();

function exportBackup(){
  var out={contacts:db.contacts};
  var b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='聊天档案_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function updateStageLabel(){
  var v=parseInt($('s_stage').value)||0;
  $('stageLabel').textContent=STAGES[v]||'';
}
function loadSet(){
  const c=A();
  $('s_api').value=db.apiKey||'';
  $('s_nick').value=db.myNick||'饭炒蛋';
  if(!c) return;
  $('s_name').value=c.name||''; $('s_age').value=c.age||'';
  $('s_area').value=c.area||''; $('s_platform').value=c.platform||'';
  $('s_stage').value=c.stage||0; updateStageLabel();
  $('s_goal').value=c.goal||'维持热度';
  $('s_type').value=c.type||''; $('s_taboo').value=c.taboo||'';
  $('s_myrole').value=c.myrole||''; $('s_pattern').value=c.pattern||'';
  $('s_notes').value=c.notes||''; $('s_hist').value=c.hist||'';
  $('s_facts').value=c.facts||'';
  renderAnaHistory();
}
function saveSet(){
  const c=A();
  db.apiKey=$('s_api').value.trim();
  db.myNick=($('s_nick').value||'饭炒蛋').trim();
  if(c){
    c.name=$('s_name').value; c.age=$('s_age').value; c.area=$('s_area').value;
    c.platform=$('s_platform').value; c.stage=parseInt($('s_stage').value)||0;
    c.goal=$('s_goal').value;
    c.type=$('s_type').value; c.taboo=$('s_taboo').value;
    c.myrole=$('s_myrole').value; c.pattern=$('s_pattern').value;
    c.notes=$('s_notes').value; c.hist=$('s_hist').value;
    c.facts=$('s_facts').value;
  }
  save(); renderSel(); stat('已保存');
}
function switchTab(which){
  var isData=(which==='data');
  $('paneData').style.display=isData?'block':'none';
  $('paneProf').style.display=isData?'none':'block';
  $('tabData').className='stab'+(isData?' on':'');
  $('tabProf').className='stab'+(isData?'':' on');
}
$('tabData').onclick=function(){ switchTab('data'); };
$('tabProf').onclick=function(){ switchTab('prof'); };

$('sImport').onclick=function(){ $('sFile').click(); };
$('sFile').onchange=function(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ loadBackup(r.result); e.target.value=''; };
  r.readAsText(f);
};
